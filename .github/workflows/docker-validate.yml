name: Docker Compose Validation

on:
  pull_request:
    paths:
      - 'docker-compose.yml'
      - 'services/**/Dockerfile'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: |
          docker compose config --quiet

      - name: Build all services
        run: |
          docker compose build
