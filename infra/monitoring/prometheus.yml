global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

rule_files:
  - "alerts.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Doctor Doom Services
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8000']
    metrics_path: '/metrics'

  - job_name: 'ml-inference'
    static_configs:
      - targets: ['ml-inference:8001']

  - job_name: 'report'
    static_configs:
      - targets: ['report:8002']

  - job_name: 'notify'
    static_configs:
      - targets: ['notify:8003']

  - job_name: 'geo'
    static_configs:
      - targets: ['geo:7800']

  - job_name: 'ingest-worker'
    static_configs:
      - targets: ['ingest-worker:8005']

  - job_name: 'auth'
    static_configs:
      - targets: ['auth:8004']

  # Infrastructure
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  # Node Exporter (host metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
