[project]
name = "ml-inference"
version = "1.0.0"
description = "ML Inference Service for Doctor Doom - Thermal Panel Inspection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "redis>=5.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-image>=0.22.0",
    "opencv-python>=4.9.0",
    "pillow>=10.2.0",
    "piexif>=1.1.3",
    "onnxruntime>=1.17.0",
    "coremltools>=7.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.4.0",
    "boto3>=1.34.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "thermal-parser @ git+https://github.com/SanNianYiSi/thermal_parser.git",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
]
